name: CI/CD - Churn Prediction MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs the drift-monitoring job every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: python -m flake8 src/ tests/ monitoring/

      # models/model.pkl and data/*.csv are DVC-tracked, not committed to
      # git (see .gitignore). The raw dataset is a deterministic synthetic
      # generator, so CI rebuilds the whole pipeline from scratch here
      # instead of depending on `dvc pull` and a remote being reachable
      # from the runner.
      - name: Generate data & run DVC pipeline
        run: |
          python src/generate_dataset.py
          dvc repro

      - name: Run tests with pytest
        run: python -m pytest tests/ -v

  build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (to rebuild the model before the Docker build)
        run: pip install -r requirements.txt

      - name: Generate data & run DVC pipeline
        run: |
          python src/generate_dataset.py
          dvc repro

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/churn-mlops-api:latest

  deploy:
    name: Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  monitor-and-retrain:
    name: Drift Monitoring & Retraining
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      retrained: ${{ steps.check_retrain.outputs.retrained }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data & run DVC pipeline
        run: |
          python src/generate_dataset.py
          dvc repro

      - name: Simulate/collect production traffic
        run: python monitoring/simulate_production_traffic.py

      - name: Run drift detection
        run: python monitoring/monitor.py

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            reports/drift_report.html
            reports/drift_summary.json

      - name: Retrain if drift detected
        run: python monitoring/retrain.py

      - name: Check whether retraining actually ran
        id: check_retrain
        run: |
          RETRAIN=$(python -c "import json; print(str(json.load(open('reports/drift_summary.json'))['retrain_recommended']).lower())")
          echo "retrained=$RETRAIN" >> "$GITHUB_OUTPUT"

      # NOTE: models/model.pkl itself is DVC-tracked, not git-tracked (see
      # .gitignore + models/.gitignore, auto-generated by `dvc add`/`dvc
      # repro`), so only dvc.lock (which records the new model's hash) and
      # the plain-text report files are committed here. In a deployment
      # with a real cloud DVC remote configured, this step would also run
      # `dvc push` so other machines could `dvc pull` the retrained
      # artifact; this project's remote is a local sandbox path, so the
      # Docker build job below regenerates the model deterministically
      # from the (seeded, synthetic) dataset instead of pulling it.
      - name: Commit updated dvc.lock & reports if retrained
        if: steps.check_retrain.outputs.retrained == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dvc.lock reports/metrics.json reports/evaluation.json
          # Deliberately NOT using [skip ci]: this push needs to flow through
          # lint-and-test -> build-and-push -> deploy below so the new model
          # actually reaches Render. Using [skip ci] here would silently
          # leave the stale model running in production.
          git diff --staged --quiet || git commit -m "chore: auto-retrain model after drift detection"
          git push || echo "Nothing to push"

  # Runs only after a same-workflow retrain commit landed on main, so the
  # freshly retrained model gets rebuilt into a new image and redeployed
  # to Render without waiting for a separate manual push.
  redeploy-after-retrain:
    name: Rebuild & Redeploy Retrained Model
    needs: monitor-and-retrain
    runs-on: ubuntu-latest
    if: needs.monitor-and-retrain.outputs.retrained == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (to rebuild the model before the Docker build)
        run: pip install -r requirements.txt

      - name: Generate data & run DVC pipeline (reproduces the retrained model)
        run: |
          python src/generate_dataset.py
          dvc repro

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push retrained image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/churn-mlops-api:latest

      - name: Trigger Render deploy hook
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
